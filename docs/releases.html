<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TethrLink — Releases</title>
<meta name="description" content="Every TethrLink release: what changed, which Android versions it supports, and where to download it."/>
<link rel="icon" href="TethrLink.png"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
  /* Copied verbatim from index.html so the two pages cannot drift into two
     different palettes. If you change a token there, change it here. */
  :root{
    --ink:#05050f;
    --ink-2:#08081a;
    --panel:#0e0e24;
    --panel-2:#141433;
    --line:rgba(124,120,190,.16);
    --line-lit:rgba(124,120,190,.34);

    --indigo:#6366f1;
    --violet:#8b5cf6;
    --down:#22d3ee;          /* video, PC → tablet */
    --up:#4ade80;            /* input, tablet → PC */

    --text:#eceafb;
    --text-2:#b3afd6;
    --muted:#817da4;

    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;

    --r:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--body);
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  .wrap{max-width:860px;margin:0 auto;padding:48px 20px 96px}
  .back{font-size:14px;color:var(--text-2);text-decoration:none}
  .back:hover{color:var(--text)}
  h1{font-family:var(--display);font-size:clamp(30px,6vw,46px);line-height:1.1;
     margin:22px 0 10px;letter-spacing:-.02em}
  .lede{color:var(--muted);margin:0 0 40px}

  .rel{border:1px solid var(--line);border-radius:var(--r);
       background:linear-gradient(165deg,var(--panel),var(--ink-2));
       padding:22px 24px;margin-bottom:18px}
  .rel.first{border-color:var(--line-lit)}
  .rel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;
            justify-content:space-between}
  .ver{font-family:var(--display);font-size:24px;font-weight:700}
  .date{color:var(--muted);font-size:13px;font-family:var(--mono)}
  .latest{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
          border:1px solid var(--indigo);color:var(--indigo);
          border-radius:999px;padding:3px 9px;margin-left:10px;
          vertical-align:middle}
  .summary{margin:12px 0 14px;color:var(--text-2)}
  .compat{font-size:13px;color:var(--muted);margin:0 0 14px;
          font-family:var(--mono)}
  ul.changes{margin:0 0 18px;padding-left:18px;color:var(--text-2)}
  ul.changes li{margin-bottom:7px;font-size:14.5px}
  ul.changes li::marker{color:var(--indigo)}
  .dl{display:flex;flex-wrap:wrap;gap:10px}
  .dl a{font-size:13px;text-decoration:none;border:1px solid var(--line);
        border-radius:10px;padding:8px 14px;color:var(--text-2);
        transition:border-color .15s,color .15s}
  .dl a:hover{border-color:var(--line-lit);color:var(--text)}
  .err{padding:22px;border:1px solid var(--line);border-radius:var(--r);
       color:var(--text-2)}
  .foot{margin-top:40px;font-size:13px;color:var(--muted)}

  @media (max-width:520px){
    .rel{padding:18px 16px}
  }
</style>

<div class="wrap">
  <p><a class="back" href="./">← TethrLink</a></p>
  <h1>Releases</h1>
  <p class="lede">Every public release, what it changed, and the Android versions it supports.</p>
  <div id="list"><p class="lede">Loading…</p></div>
  <p class="foot">
    The download buttons on the <a href="./">home page</a> always point at the
    newest release.
  </p>
</div>

<script>
const REPO = "https://github.com/princesavsaviya/TethrLink";

function assetUrl(tag, name) {
  // Per-release assets live under the tag; only `latest` has the stable
  // unversioned path, so historical rows must address their own tag.
  return `${REPO}/releases/download/${tag}/${name}`;
}

function render(data) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  data.releases.forEach((r, i) => {
    const el = document.createElement("article");
    el.className = i === 0 ? "rel first" : "rel";

    const head = document.createElement("div");
    head.className = "rel-head";
    const left = document.createElement("div");
    const ver = document.createElement("span");
    ver.className = "ver";
    ver.textContent = r.version;
    left.appendChild(ver);
    if (i === 0) {
      const tagEl = document.createElement("span");
      tagEl.className = "latest";
      tagEl.textContent = "Latest";
      left.appendChild(tagEl);
    }
    const date = document.createElement("span");
    date.className = "date";
    date.textContent = r.date;
    head.append(left, date);
    el.appendChild(head);

    const sum = document.createElement("p");
    sum.className = "summary";
    sum.textContent = r.summary;
    el.appendChild(sum);

    const compat = document.createElement("p");
    compat.className = "compat";
    compat.textContent =
      `Android ${r.android.minLabel.replace("Android ", "")} and newer ` +
      `(API ${r.android.minSdk}–${r.android.targetSdk}) · Linux with GNOME on Wayland`;
    el.appendChild(compat);

    const ul = document.createElement("ul");
    ul.className = "changes";
    r.changes.forEach(c => {
      const li = document.createElement("li");
      li.textContent = c;
      ul.appendChild(li);
    });
    el.appendChild(ul);

    const dl = document.createElement("div");
    dl.className = "dl";
    if (r.assets.deb) {
      const a = document.createElement("a");
      a.href = assetUrl(r.tag, r.assets.deb);
      a.textContent = ".deb package";
      dl.appendChild(a);
    }
    if (r.assets.apk) {
      const a = document.createElement("a");
      a.href = assetUrl(r.tag, r.assets.apk);
      a.textContent = "Android .apk";
      dl.appendChild(a);
    }
    const notes = document.createElement("a");
    notes.href = `${REPO}/releases/tag/${r.tag}`;
    notes.textContent = "Release notes";
    dl.appendChild(notes);
    el.appendChild(dl);

    list.appendChild(el);
  });
}

fetch("releases.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById("list").innerHTML =
      `<div class="err">Couldn't load the release list (${e.message}). ` +
      `All releases are on <a href="${REPO}/releases">GitHub</a>.</div>`;
  });
</script>
