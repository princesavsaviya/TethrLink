name: tethrlink
title: TethrLink
base: core24
version: '2.0.2'
summary: Turn your Android tablet into a wired second monitor for Linux.
description: |
  TethrLink turns an Android tablet into a real second monitor for your Linux
  PC — not a mirror of a screen you already have — over a direct USB
  connection. No Wi-Fi, no router, no cloud, no account.

  The PC asks GNOME to create a dedicated virtual display, captures it through
  PipeWire, encodes it with hardware H.264 (or JPEG), and streams it down the
  cable. Windows you drag onto the tablet stay there, and GNOME arranges it
  like any other monitor.

  Features:
  • A real second display, not a screen mirror
  • Touch input driving your pointer (opt-in)
  • Zero-config transport — USB tethering, no router needed
  • Hardware H.264 via NVENC, VA-API or QSV, with a JPEG fallback
  • Display size derived from your monitor and the tablet's aspect ratio
  • UDP auto-discovery — no IP address to type
  • GTK4 + Libadwaita desktop app

  Requires GNOME on Wayland. X11 sessions fall back to JPEG, video only.
  Serves only devices on a USB-attached interface; Wi-Fi and container
  bridges are refused.

icon: debian_build/usr/share/icons/hicolor/512x512/apps/tethrlink.png

license: GPL-3.0
contact: princesavsaviya2023.learning@gmail.com
source-code: https://github.com/princesavsaviya/TethrLink
issues: https://github.com/princesavsaviya/TethrLink/issues
website: https://princesavsaviya.github.io/TethrLink

platforms:
  amd64:

# ─────────────────────────────────────────────────────────────────────────────
# WORK IN PROGRESS — not the shipping recipe. snap/snapcraft.yaml is.
#
# Build it with `./build_snap.sh classic`, never by renaming it over
# snapcraft.yaml by hand (the payload under debian_build/usr/lib/tethrlink/ is
# generated and goes stale silently — that is what build_snap.sh exists to
# prevent).
#
# WHY THIS EXISTS
#
# The shipping recipe is devmode, because strict confinement cannot create the
# virtual display at all: Mutter's ScreenCast/RecordVirtual API is private,
# the portal spec has no virtual-monitor mechanism by design, and no snapd
# interface grants it (`screencast-legacy` covers only
# /org/gnome/Shell/Screen{cast,shot}). See snap/snapcraft.yaml for the full
# diagnosis and the AppArmor denial it produces.
#
# devmode works but cannot leave beta/edge, is excluded from store search, and
# never auto-refreshes. Classic lifts all three. The catch is that
# `extensions: [gnome]` refuses to build classic —
#
#   Extension 'gnome' does not support confinement 'classic'
#
# — and that extension is where the devmode snap gets python3.12, GTK4,
# libadwaita and all 107 GStreamer plugins, via the gnome-46-2404 platform
# snap. So going classic means staging that entire stack here instead. That is
# what the parts below do.
#
# STATUS: builds, and the bundle has been smoke-tested — the staged
# interpreter imports gi, dbus, Gtk 4, Adw 1 and Gst with sys.prefix inside
# the snap, and GStreamer finds pipewiresrc, x264enc, h264parse, jpegenc,
# videoconvert and appsink. What has NOT been verified is the app actually
# running end to end: installing it needs root, and no tablet has connected
# to this build yet.
#
# Two known rough edges, both non-blocking:
#   • snapcraft's classic linter warns that libproxy.so.0.5.4 and
#     libpulse.so.0.24.2 keep an unpatched rpath. Neither is on the capture
#     path (glib networking and GStreamer audio pull them in).
#   • `grade: devel`, deliberately, until the end-to-end run above happens.
#     Flip it to `stable` then, not before.
#
# Publishing this additionally needs classic-confinement approval on the
# Snapcraft forum (https://forum.snapcraft.io/c/store-requests/19) — a manual
# human review, requested with the reasoning above.
# ─────────────────────────────────────────────────────────────────────────────
grade: devel
confinement: classic

# No plugs or slots: a classic snap runs unconfined, so interface connections
# are not consulted. Network access, the PipeWire socket, the Mutter D-Bus
# calls and the com.tethrlink.server bus name (owned by GApplication, see
# server/app/main.py) all work without declaring anything.
apps:
  tethrlink:
    command: usr/bin/tethrlink
    desktop: usr/share/applications/tethrlink.desktop
    environment:
      # PATH first: the launcher runs plain `python3`, and on a classic snap
      # the host's /usr/bin is visible, so without this it would pick up the
      # host interpreter and run it against our staged 3.12 stdlib.
      PATH: $SNAP/usr/bin:$SNAP/bin:$PATH
      PYTHONPATH: $SNAP/usr/lib/tethrlink
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib:$LD_LIBRARY_PATH
      # PyGObject finds GTK4/Adw/Gst through typelibs, which are data files
      # and so are not covered by patchelf's rpath rewriting.
      GI_TYPELIB_PATH: $SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0
      # GStreamer's compiled-in system path is the base's /usr/lib, which has
      # no plugins at all. Both the plugin dir and the out-of-process scanner
      # have to be pointed inside the snap or the registry comes up empty.
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/x86_64-linux-gnu/gstreamer-1.0
      GST_PLUGIN_SCANNER: $SNAP/usr/lib/x86_64-linux-gnu/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner
      # Host entries kept last and deliberately: on a classic snap the host's
      # GSettings schemas, icon themes and fonts are real and visible, and
      # using them is what makes the app look native instead of bundling a
      # second copy of GNOME's theming.
      XDG_DATA_DIRS: $SNAP/usr/share:/usr/share:/usr/local/share:$XDG_DATA_DIRS
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas

parts:
  # core24's base ships python3.12, so snapcraft silently drops it from
  # stage-packages as "already provided by the base". That is correct for
  # strict and devmode, where the base *is* the root filesystem. It is wrong
  # for classic, which runs against the host's root instead: the first build
  # of this recipe produced a snap with usr/lib/python3/dist-packages full of
  # cpython-312 extension modules (python3-gi, python3-dbus, pycairo) and no
  # interpreter at all, so `python3` would have resolved to whatever the host
  # happens to have — a different minor version cannot load those .so files.
  #
  # apt-get download goes around that filter: the packages are fetched and
  # unpacked directly into the part, so snapcraft never gets to decide the
  # base already covers them.
  python-interpreter:
    plugin: nil
    build-attributes:
      - enable-patchelf
    override-build: |
      set -eux
      apt-get download \
          python3.12 python3.12-minimal \
          libpython3.12-stdlib libpython3.12-minimal
      for deb in *.deb; do
          dpkg-deb -x "${deb}" "${CRAFT_PART_INSTALL}"
      done
      rm -f ./*.deb
      # The `python3` name itself comes from the python3 package, which is
      # base-filtered too — and the launcher execs plain `python3`.
      ln -sf python3.12 "${CRAFT_PART_INSTALL}/usr/bin/python3"

  # The app itself, identical to the devmode recipe: debian_build/ is the
  # staging tree that build_deb.sh regenerates from server/.
  copy-debian-build:
    plugin: dump
    source: debian_build/
    build-attributes:
      # Mandatory for classic: snapcraft rewrites each ELF's interpreter and
      # rpath to point inside the snap. Without it the staged binaries resolve
      # against the host's libraries and break on any host whose versions
      # differ from 24.04's.
      - enable-patchelf
    stage-packages:
      # Interpreter and its bindings. python3-dbus is in this list and not in
      # the devmode recipe for a reason: the gnome platform happens to supply
      # it, a bare core24 base does not, and server_core.py imports dbus at
      # module scope — so leaving it out fails at startup, not at connect.
      - python3
      - python3-gi
      - python3-gi-cairo
      - python3-dbus

      # GTK4 + libadwaita, with the typelibs PyGObject actually reads.
      - libgtk-4-1
      - libadwaita-1-0
      - gir1.2-gtk-4.0
      - gir1.2-adw-1

      # GStreamer. -ugly carries x264enc and -bad carries h264parse
      # (videoparsersbad); both are required for the H.264 path and are the
      # two plugins the devmode recipe has to graft onto the platform snap by
      # hand. Here they come from the same archive as everything else, so the
      # libharfbuzz/GTK3 symbol clash that forced that hand-grafting
      # (undefined symbol: hb_free) cannot arise — there is no second,
      # differently-built GTK in the picture.
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-pipewire
      - gir1.2-gstreamer-1.0
      - gir1.2-gst-plugins-base-1.0
