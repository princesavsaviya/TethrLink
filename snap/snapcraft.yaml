name: tethrlink
title: TethrLink
base: core24
version: '2.0.1'
summary: Turn your Android tablet into a wired second monitor for Linux.
description: |
  TethrLink turns an Android tablet into a real second monitor for your Linux
  PC — not a mirror of a screen you already have — over a direct USB
  connection. No Wi-Fi, no router, no cloud, no account.

  The PC asks GNOME to create a dedicated virtual display, captures it through
  PipeWire, encodes it with hardware H.264 (or JPEG), and streams it down the
  cable. Windows you drag onto the tablet stay there, and GNOME arranges it
  like any other monitor.

  New in 2.0.0 — touch input. Tap to click, drag to drag, long press to
  right-click, two-finger drag to scroll. Touch is off by default; you enable
  it in the server window.

  Features:
  • A real second display, not a screen mirror
  • Touch input driving your pointer (opt-in)
  • Zero-config transport — USB tethering, no router needed
  • Hardware H.264 via NVENC, VA-API or QSV, with a JPEG fallback
  • Display size derived from your monitor and the tablet's aspect ratio
  • UDP auto-discovery — no IP address to type
  • GTK4 + Libadwaita desktop app

  Requires GNOME on Wayland. X11 sessions fall back to JPEG, video only.
  Serves only devices on a USB-attached interface; Wi-Fi and container
  bridges are refused.

# The icon goes here at the root level!
icon: debian_build/usr/share/icons/hicolor/512x512/apps/tethrlink.png

# Added Metadata from your README to remove warnings
license: GPL-3.0
contact: princesavsaviya2023.learning@gmail.com
source-code: https://github.com/princesavsaviya/TethrLink
issues: https://github.com/princesavsaviya/TethrLink/issues
website: https://princesavsaviya.github.io/TethrLink

platforms:
  amd64:

grade: stable
confinement: strict

slots:
  tethrlink-dbus:
    interface: dbus
    bus: session
    name: com.tethrlink.server

plugs:
  mutter-screencast:
    interface: dbus
    bus: session
    name: org.gnome.Mutter.ScreenCast
  mutter-display-config:
    interface: dbus
    bus: session
    name: org.gnome.Mutter.DisplayConfig

apps:
  tethrlink:
    command: usr/bin/tethrlink
    desktop: usr/share/applications/tethrlink.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - network-observe
      - mutter-screencast
      - mutter-display-config
      - pipewire
    slots:
      - tethrlink-dbus
    environment:
      PYTHONPATH: $SNAP/usr/lib/tethrlink
      PIPEWIRE_RUNTIME_DIR: /run/user/1000
      # Staged plugins land here; the gnome extension only points GStreamer at
      # the platform snap, so without this the new plugins are invisible.
      GST_PLUGIN_PATH: $SNAP/usr/lib/x86_64-linux-gnu/gstreamer-1.0

parts:
  copy-debian-build:
    plugin: dump
    source: debian_build/
    stage-packages:
      - python3
      - python3-gi
      - python3-gi-cairo

  # The gnome platform ships 107 GStreamer plugins but not the two H.264
  # needs: x264enc lives in -ugly, h264parse in -bad (videoparsersbad).
  # Without them the pipeline fails to build at connect time with
  # `no element "x264enc"` and the client drops back to scanning.
  #
  # Only the two plugin binaries are primed. Staging these packages whole
  # pulls in ~500 libraries including a full GTK3 stack, which shadows the
  # platform's GTK4 and breaks the app before it starts (undefined symbol:
  # hb_free, from a mismatched libharfbuzz). Their actual dependencies —
  # libx264.so.164 and libgstcodecparsers — are already in the platform,
  # so nothing else has to ship.
  gst-h264-plugins:
    plugin: nil
    stage-packages:
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-plugins-bad
    prime:
      - usr/lib/x86_64-linux-gnu/gstreamer-1.0/libgstx264.so
      - usr/lib/x86_64-linux-gnu/gstreamer-1.0/libgstvideoparsersbad.so
